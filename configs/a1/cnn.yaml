# NOTE(A1): Preparation config; cnn remains unregistered until implementation and integration.
assignment: a1
task: classification
experiment_name: cnn
seed: 42
device: auto
dataset:
  name: fashion_mnist
  root: data
  download: true
  batch_size: 64
  num_workers: 0
  val_ratio: 0.1
  normalization: true
model:
  name: cnn
  parameters:
    base_channels: 32
    fc_size: 128
    dropout_rate: 0.5
training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0
checkpoint:
  root: checkpoints
logging:
  root: logs
results:
  root: results
