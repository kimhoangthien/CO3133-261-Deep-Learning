assignment: a1
task: classification
experiment_name: rnn
seed: 42
device: auto
dataset:
  name: fashion_mnist
  root: data
  download: true
  batch_size: 64
  num_workers: 0
  val_ratio: 0.1
  normalization: true
model:
  name: rnn
  # Each of the 28 image rows is one timestep; its 28 pixels are the input features.
  parameters:
    recurrent_type: lstm
    input_size: 28
    hidden_size: 128
    num_layers: 1
    dropout: 0.0
training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0
checkpoint:
  root: checkpoints
logging:
  root: logs
results:
  root: results
