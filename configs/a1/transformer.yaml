assignment: a1
task: classification
experiment_name: transformer
seed: 42
device: auto
dataset:
  name: fashion_mnist
  root: data
  download: true
  batch_size: 64
  num_workers: 0
  val_ratio: 0.1
  normalization: true
model:
  name: transformer
  parameters:
    # Rows give 28 tokens of 28 pixels, the representation the recurrent
    # model also uses, so the two differ only by inductive bias.
    tokens: rows
    patch_size: 7          # only read when tokens is 'patches': 16 tokens of 49 pixels
    d_model: 64
    nhead: 4               # 16 dimensions per head
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    positional: sinusoidal # 'learned' costs (tokens + 1) * d_model parameters
    pooling: cls           # 'mean' averages the encoded tokens instead
training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0
checkpoint:
  root: checkpoints
logging:
  root: logs
results:
  root: results
